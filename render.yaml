# Render blueprint: the API (under /api) and its Postgres database. The website, demo and app are on Netlify,
# which proxies /api/* here (set API_ORIGIN on Netlify to this service's URL).
# New → Blueprint → pick this repository. Secrets marked sync: false are entered in the Render dashboard.
services:
  - type: web
    name: fade
    runtime: node
    # Free instances sleep when idle, and a sleeping server sends no reminders. Use an always-on plan
    # (starter or above) before real shops rely on reminders.
    plan: free
    region: frankfurt
    buildCommand: npm ci --include=dev
    startCommand: npm start -w api
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: fade-db
          property: connectionString
      - key: SERVE_STATIC
        value: "false"
      # The public address people use (Netlify), for links in e-mails.
      - key: PUBLIC_URL
        value: https://usta-fade.netlify.app
      - key: API_PREFIX
        value: /api
      - key: TRUST_PROXY
        value: "true"
      - key: ALLOW_SIGNUP
        value: "false"
      - key: JWT_SECRET
        generateValue: true
      - key: SERVICE_API_KEY
        generateValue: true
      - key: ADMIN_API_KEY
        generateValue: true
      # Stripe: secret key, the monthly price id (price_...) and the webhook signing secret (whsec_...).
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_PRICE_ID
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      # Resend: API key and a sender on a verified domain, e.g. "Fade <hello@yourdomain.com>".
      - key: RESEND_API_KEY
        sync: false
      - key: MAIL_FROM
        sync: false
      # DeepSeek for the assistant (optional; without it the built-in engine runs).
      - key: AI_API_KEY
        sync: false
      - key: AI_BASE_URL
        value: https://api.deepseek.com
      - key: AI_MODEL
        value: deepseek-chat
      # Reminder sending (docs/hatirlatma-gonderimi.md). Any pair left empty = that channel is off.
      - key: WHATSAPP_TOKEN
        sync: false
      - key: WHATSAPP_PHONE_NUMBER_ID
        sync: false
      - key: WHATSAPP_APP_SECRET
        sync: false
      - key: WHATSAPP_VERIFY_TOKEN
        sync: false
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_FROM
        sync: false
      # Square connection (docs/square-baglantisi.md). Empty app id/secret = connections off.
      - key: SQUARE_APP_ID
        sync: false
      - key: SQUARE_APP_SECRET
        sync: false
      - key: SQUARE_ENV
        value: sandbox
      - key: CONNECTION_SECRET
        generateValue: true

databases:
  - name: fade-db
    plan: free
    region: frankfurt
    databaseName: fade
    user: fade
